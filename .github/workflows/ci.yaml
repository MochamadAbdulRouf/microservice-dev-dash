name: CI Pipeline - DevDash

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DOCKER_HUB_USERNAME: mochabdulrouf
  GITOPS_REPO: mochabdulrouf/microservice-ci-cd

jobs:

# ------------------ Test & lint ------------------

  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    strategy: 
      matrix:
        service: [api-gateway, weather-service, quote-service]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4


      - name: setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.service }}/package-lock.json

      - name: install dependecies
        working-directory: ${{ matrix.service }}
        run: npm ci

# ------------------ Security Scan  ------------------

  security-deps:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix: 
        service: [api-gateway, weather-service, quote-service]

    steps:
      - uses: actions/checkout@v4

      - name: Scan npm dependencies (Audit)
        working-directory: ${{ matrix.service }}
        run: |
          npm audit --audit-level=high


  build-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs: security-deps
    if: github.ref = 'refs/heads/main'
    strategy:
      matrix:
        service: [api-gateway, weather-service, quote-service]
      
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - uses: actions/checkout@v4
      
      - name: Set Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate image metadata & tag
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_HUB_USERNAME }}/${{ matrix.service }}
          tags: |
            type=sha,prefix=,suffix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          push: true 
          tags: ${{ steps.meta.outputs.tags }}
          label: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha 
          cache-to: type=gha,mode=max

  security_image:
    name: Image Security Scan
    runs-on: ubuntu-latest
    needs: build-push
    strategy:
      matrix:
        service: [api-gateway, weather-service, quote-service]
    
    steps:  
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.DOCKERHUB_USERNAME }}/${{ matrix.service }}:latest'
          format: 'table'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'

      - name: Upload hasil scan ke Github Security Tab
        uses: aquasecurit/trivy-action@master
        with:
          image-ref: '${{ env.DOCKERHUB_USERNAME }}/${{ matrix.service }}:latest'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload SARIF ke github
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

  update-gitops:
    name: Update GitOps Repo
    runs-on: ubuntu-latest
    needs: security_image

    steps:
      - name: Generate image tag dari commit SHA
        id: tag
        run: echo "TAG=$(echo $GITHUB_SHA | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Checkout GitOps repo
        uses: actions/checkout@v4
        with: 
          repository: ${{ env.GITOPS_REPO }}
          token: ${{ secrets.GITOPS_PAT }}

      - name: Update image tag di semua Deployment YAML
        run: |
          for SERVICE in api-gateway weather-service quote-service; do
            FILE="apps/${SERVICE}/deployment.yaml"
            sed -i "s|mochabdulrouf/${SERVICE}:.*|mochabdulrouf/${SERVICE}:${{ steps.tag.outputs.TAG }}|g" $FILE
            echo "Updated ${FILE} to tag: ${{ steps.tag.outputs.TAG }}"
          done
      
      - name: Commit dan Push perubahan ke GitOps repo
        run: | 
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add .
          git commit -m "ci: update image tag to ${{ steps.tag.outputs.TAG }}

          Trigger by: ${{ github.repository }}@${{ github.sha }}
          Actor: ${{ github.actor }}
          WorkFlow: ${{ github.workflow }}"
          
          git push

      - name: Notify Slack - deployment triggered
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: | 
            {
            "text": "${{ job.status == 'success' && 'Deployment triggered' || 'CI FAILED' }}: DevDash `${{ steps.tag.outputs.TAG }}` — ${{ github.actor }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    

      