apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-service
  labels:
    app: api-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-service
  template:
    metadata:
      labels:
        app: api-service
    spec:
      containers:
        - name: api-gateway
          image: mochabdulrouf/api-gateway
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: "production"
            - name: WEATHER_SERVICE_URL
              value: "http://weather-service:3001"
            - name: QUOTE_SERVICE_URL
              value: "http://quote-service:3002"
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10

---

apiVersion: v1
kind: Service
metadata:
  name: api-service
spec:
  type: NodePort
  selector:
    app: api-service
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
      nodePort: 30000