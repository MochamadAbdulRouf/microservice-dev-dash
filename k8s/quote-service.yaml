apiVersion: apps/v1
kind: Deployment 
metadata:
  name: quote-service
  labels:
    app: quote-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: quote-service
    template:
      metadata:
        labels:
          app: quote-service
      spec:
        containers:
          - name: quote-service
            image: mochabdulrouf/quote-sevice:latest
            ports:
              - containerPort: 3002
            env:
              - name: NODE_ENV
                value: "production"
            resources:
              requests:
                memory: "64Mi"
                cpu: "100m"
              limits:
                memory: "128Mi"
                cpu: "200m"
            livenessProbe:
              httpGet:
                path: /health
                port: 3002
              initialDelaySeconds: 10
              periodSeconds: 15
            readinessProbe:
              httpGet:
                path: /health
                port: 3002
              initialDelaySecons: 5
              periodSeconds: 10

---

apiVersion: v1
kind: Service
metadata:
  name: quote-service
spec:
  type: NodePort
  selector:
    app: quote-service
  ports:
    - protocol: TCP
      port: 3002
      targetPort: 3002
      nodePort: 30002