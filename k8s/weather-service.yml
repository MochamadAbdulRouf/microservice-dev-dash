apiVersion: apps/v1
kind: Deployment
metadata: 
  name: weather-service
  labels:
    app: weather-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: weather-service
    template:
      metadata:
        labels:
          app: weather-service
      spec:
        containers:
          - name: weather-service
            image: mochabdulrouf/weather-service:latest
            ports:
              - containerPort: 3001
            env:
              - name: NODE_ENV
                value: "production"
            resources:
              requests:
                memory: "64Mi"
                cpu: "100m"
              limits:
                memory: "128Mi"
                cpu: "200m"
            livenessProbe:
              httpGet:
                path: /health
                port: 3001
              initialDelaySeconds: 10
              periodSeconds: 15
            readinessProbe:
              httpGet:
                path: /health
                port: 3001
              initialDelaySeconds: 5
              periodSeconds: 10

---

apiVersion: v1
kind: Service
metadata:
  name: weather-service
spec:
  type: NodePort
  selector:
    app: weather-service
  ports:
  - protocol: TCP
    port: 3001 
    targetPort: 3001
    nodePort: 30001